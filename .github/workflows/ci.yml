name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Frontend, then backend
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mkconsult/src/main/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: mkconsult/src/main/frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        working-directory: mkconsult/src/main/frontend
        run: pnpm exec tsc --noEmit

      - name: Build frontend
        working-directory: mkconsult/src/main/frontend
        run: pnpm build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test backend
        working-directory: mkconsult
        run: ./mvnw test
